[HEADER]
VERSION=2 ; version number

[INFO]
SCREEN_NAME=Porsche 356 A 1600 Coupe					; Name of the car. Used on info apps ingame and to identify the car on servers etc.
SHORT_NAME=Porsche 356A Coupe

[BASIC]
GRAPHICS_OFFSET=0,-0.42,0.135			; 3 axis correction (x,y,z), applies only to the 3D object of the car. in meters
GRAPHICS_PITCH_ROTATION=0.0			; changes 3D object rotation in pitch
TOTALMASS=925						; (850kg) total vehicle weight in kg with driver and no fuel
INERTIA=1.550,1.20,3.40				; car polar inertia. Calculated from the car dimensions. Just enter the generic width,height,

[GRAPHICS]
DRIVEREYES=0.30238,1.01546,-0.301129
ONBOARD_EXPOSURE=18
OUTBOARD_EXPOSURE=33
ON_BOARD_PITCH_ANGLE=-3.489012
BUMPER_CAMERA_POS=0.000000,0.400000,1.6
BONNET_CAMERA_POS=0.000000,0.550000,0.840000
BONNET_CAMERA_PITCH=-4.145946
MIRROR_POSITION=0.0,1.3,0.5 ; Position used to render the mirror
VIRTUAL_MIRROR_ENABLED=0
USE_ANIMATED_SUSPENSIONS=0
SHAKE_MUL=2.2
FUEL_LIGHT_MIN_LITERS=10
BUMPER_CAMERA_PITCH=0.0

[CONTROLS]
FFMULT=8.178
STEER_ASSIST=1.000
STEER_LOCK=450					; Real car's steer lock from center to right
STEER_RATIO=16.1					; Steer ratio
LINEAR_STEER_ROD_RATIO=0.00247

[FUEL]
CONSUMPTION=0.0036				; fuel consumption. In one second the consumption is (rpm*gas*CONSUMPTION)/1000 litres
FUEL=25						; default starting fuel in litres
MAX_FUEL=52							; max fuel in litres

[FUELTANK]
POSITION=0,-0.00,1.35

[RIDE]
PICKUP_FRONT_HEIGHT=-0.240			; Height of the front ride height pickup point in meters WRT cg
PICKUP_REAR_HEIGHT=-0.250

[PIT_STOP]
TYRE_CHANGE_TIME_SEC=10            ; time spent to change each tyre
FUEL_LITER_TIME_SEC=0.6   ; time spent to put 1 lt of fuel inside the car
BODY_REPAIR_TIME_SEC=20    ; time spent to repair 10% of body damage
ENGINE_REPAIR_TIME_SEC=2  ; time spent to repair 10% of engine damage
SUSP_REPAIR_TIME_SEC=30   ; time spent to repair 10% of suspension damage

